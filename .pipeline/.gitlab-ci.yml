# ==============================================================================
# DEAP Production GitLab CI/CD Pipeline Specification
# Standard: RTCA DO-178C / DO-331 / ISO 15288 / ASTM F3269-17
# ==============================================================================

stages:
  - lint
  - test

variables:
  CARGO_TERM_COLOR: "always"

default:
  image: rust:latest
  before_script:
    - cargo --version
    - cargo build --release -p verify-baseline

lint:downstream-baseline:
  stage: lint
  script:
    - echo "=== Running Downstream Baseline Conformance Gate ==="
    - ./target/release/verify-baseline . --no-domain

test:unit-and-parity:
  stage: test
  script:
    - echo "=== Running Native Rust Workspace Verification Suite ==="
    - cargo test --workspace

