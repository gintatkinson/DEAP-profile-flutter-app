# ==============================================================================
# DEAP Production GitLab CI/CD Pipeline Specification
# Standard: RTCA DO-178C / DO-331 / ISO 15288 / ASTM F3269-17 / SORA v2.5
# Primary Commercial Toolchain Context: MATLAB / Simulink / Stateflow / Embedded Coder
# ==============================================================================

image: rust:latest

variables:
  CARGO_TERM_COLOR: "always"
  TRACKER_PROVIDER: "gitlab"
  GIT_DEPTH: "50"

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - target/

stages:
  - lint
  - test
  - verify

default:
  before_script:
    - cargo --version
    - which git || (apt-get update && apt-get install -y --no-install-recommends git)
    - cargo build --release -p verify-baseline

# ------------------------------------------------------------------------------
# Stage 1: Lint (Downstream Baseline Conformance Checks 10-35)
# ------------------------------------------------------------------------------

lint:downstream-baseline:
  stage: lint
  script:
    - echo "=== Stage 1: Verifying Downstream Baseline Conformance (Checks 10-35) ==="
    - ./target/release/verify-baseline . --no-domain

# ------------------------------------------------------------------------------
# Stage 2: Test (Workspace Native Rust Test Suite)
# ------------------------------------------------------------------------------

test:unit-and-parity:
  stage: test
  script:
    - echo "=== Stage 2: Executing Native Rust Workspace Test Suite ==="
    - cargo test --workspace

# ------------------------------------------------------------------------------
# Stage 3: Verify (Mechanical Parity Lock & Specification Model Coverage)
# ------------------------------------------------------------------------------

verify:model-coverage:
  stage: verify
  script:
    - echo "=== Stage 3: Executing Mechanical Parity Lock & Model Coverage ==="
    - ./target/release/verify-baseline . --no-domain
    - ./target/release/verify-baseline . --spec-only

